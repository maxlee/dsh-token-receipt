name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check
        run: |
          npm run check
          npm test
      - name: Verify tag matches package version
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { version } = JSON.parse(readFileSync("./package.json", "utf8"));
            const expected = `v${version}`;
            if (process.env.GITHUB_REF_NAME !== expected) {
              console.error(`Tag ${process.env.GITHUB_REF_NAME} does not match package.json version (${expected}).`);
              process.exit(1);
            }
          '
      # Authentication uses npm Trusted Publishing over GitHub OIDC: no NPM_TOKEN
      # secret is needed. The package's trusted publisher is bound to this
      # repository and this workflow file (see RELEASING.md).
      - name: Publish to npm
        run: npm publish --provenance --access public
